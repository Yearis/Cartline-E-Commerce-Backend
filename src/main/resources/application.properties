spring.application.name=e-commerce

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=when_authorized

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.jpa.open-in-view=false

server.servlet.context-path=/cartline

springdoc.swagger-ui.path=/docs

server.error.include-message=always

# Allows 'Enter' keys (newlines) and 'Tabs' inside JSON strings
spring.jackson.parser.allow-unquoted-control-chars=true

# Allows single quotes (don't, it's, etc.)
spring.jackson.parser.allow-single-quotes=true

springdoc.writer-with-default-pretty-printer=true

spring.jwt.secret=${JWT_SECRET}

# 15mins
spring.jwt.expiration=900000

spring.jwt.refresh-token.expiration=604800

# For Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# For SMTP
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
app.email.from=${MAIL_SENDER}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=5000
